name: Build

on:
  push:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  discover-targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover supported Minecraft targets
        id: versions
        shell: bash
        run: |
          VERSIONS="$(grep -E '^\s*"[0-9]+\.[0-9]+(\.[0-9]+)?"\s+to\s+MinecraftVersionSpec\(' build.gradle.kts \
            | sed -E 's/^\s*"([^"]+)".*/\1/' \
            | jq -R . \
            | jq -s -c .)"

          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test

      - name: Verify Fabric and NeoForge run task wiring
        run: ./gradlew runClient runServer runNeoForgeClient runNeoForgeServer --dry-run

  build:
    needs:
      - discover-targets
      - test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft_version: ${{ fromJSON(needs.discover-targets.outputs.versions) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Fabric and NeoForge jars for Minecraft ${{ matrix.minecraft_version }}
        run: ./gradlew clean buildBothLoaders -Pmc_version=${{ matrix.minecraft_version }}

      - name: Collect loader jars for Minecraft ${{ matrix.minecraft_version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/release-candidates
          mapfile -t jars < <(
            {
              find build/libs -maxdepth 1 -type f -name "*+mc${{ matrix.minecraft_version }}-neoforge.jar"
              find fabric/build/libs -maxdepth 1 -type f -name "*+mc${{ matrix.minecraft_version }}-fabric.jar"
            } | sort
          )

          if [ "${#jars[@]}" -ne 2 ]; then
            echo "Expected one Fabric jar and one NeoForge jar for Minecraft ${{ matrix.minecraft_version }}, found ${#jars[@]}."
            find build/libs fabric/build/libs -maxdepth 1 -type f -name '*.jar' | sort || true
            exit 1
          fi

          printf '%s\n' "${jars[@]}" | grep -q -- '-fabric\.jar$' || {
            echo "Fabric jar was not generated."
            printf '%s\n' "${jars[@]}"
            exit 1
          }
          printf '%s\n' "${jars[@]}" | grep -q -- '-neoforge\.jar$' || {
            echo "NeoForge jar was not generated."
            printf '%s\n' "${jars[@]}"
            exit 1
          }

          for jar in "${jars[@]}"; do
            cp "$jar" build/release-candidates/
          done

          echo "Collected jars:"
          find build/release-candidates -maxdepth 1 -type f -name '*.jar' | sort

      - name: Upload loader jars
        uses: actions/upload-artifact@v4
        with:
          name: pathmind-${{ matrix.minecraft_version }}-loaders
          path: build/release-candidates/*.jar
          if-no-files-found: error
          retention-days: 90

  publish-prerelease:
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          path: build/release-assets
          merge-multiple: true

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t jars < <(find build/release-assets -maxdepth 1 -type f -name '*.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jars were downloaded."
            exit 1
          fi
          if ! printf '%s\n' "${jars[@]}" | grep -q -- '-fabric\.jar$'; then
            echo "No Fabric release jars were downloaded."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          if ! printf '%s\n' "${jars[@]}" | grep -q -- '-neoforge\.jar$'; then
            echo "No NeoForge release jars were downloaded."
            printf '%s\n' "${jars[@]}"
            exit 1
          fi

          notes_file="$(mktemp)"
          {
            echo "Rolling test-build prerelease for Pathmind."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Artifacts:"
            for jar in "${jars[@]}"; do
              echo "- $(basename "$jar")"
            done
          } > "$notes_file"

          if gh release view test-builds >/dev/null 2>&1; then
            gh release delete test-builds --yes --cleanup-tag
          fi

          gh release create test-builds "${jars[@]}" \
            --target "${GITHUB_SHA}" \
            --title "Pathmind test builds" \
            --notes-file "$notes_file" \
            --prerelease

  notify-discord:
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    needs:
      - publish-prerelease
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download release jars
        uses: actions/download-artifact@v4
        with:
          path: build/release-assets
          merge-multiple: true

      - name: Post build links to Discord
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: "1498698231796859070"
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_BOT_TOKEN:-}" ]; then
            echo "DISCORD_BOT_TOKEN is not configured; skipping Discord notification."
            exit 0
          fi

          COMMIT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MESSAGE="$(jq -r '.head_commit.message // .pull_request.title // ""' "$GITHUB_EVENT_PATH" | head -n 1)"
          if [ -z "${COMMIT_MESSAGE:-}" ] || [ "${COMMIT_MESSAGE}" = "null" ]; then
            COMMIT_MESSAGE="No commit message available"
          fi
          BUILD_TIMESTAMP="$(date -u +%s)"

          mapfile -t jars < <(find build/release-assets -maxdepth 1 -type f -name '*.jar' | sort)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No release jars were available to post."
            exit 1
          fi

          DOWNLOADS="$(
            printf '%s\n' "${jars[@]}" \
              | sed 's#^.*/##' \
              | jq -R . \
              | jq -s -r --arg repo "${GITHUB_REPOSITORY}" '
                  map(
                    . as $file
                    | ($file | capture("\\+mc(?<version>[0-9.]+)-(?<loader>fabric|neoforge)\\.jar$")) as $meta
                    | {
                        file: $file,
                        version: $meta.version,
                        loader: $meta.loader
                      }
                  )
                  | sort_by([(.version | split(".") | map(tonumber)), .loader])
                  | map(
                      "- `"
                      + .version
                      + "` "
                      + (if .loader == "fabric" then "Fabric" else "NeoForge" end)
                      + " - [Download](<https://github.com/"
                      + $repo
                      + "/releases/download/test-builds/"
                      + .file
                      + ">)"
                    )
                  | join("\n")
                '
          )"

          if [ -z "${DOWNLOADS:-}" ]; then
            echo "No release download links were available to post."
            exit 1
          fi

          SUMMARY_LINE="$(printf '**Branch:** %s\n**Commit:** [`%s`](<https://github.com/%s/commit/%s>) %s\n**Built:** <t:%s:F>' \
            "${GITHUB_REF_NAME:-${GITHUB_REF}}" \
            "${SHORT_SHA}" \
            "${GITHUB_REPOSITORY}" \
            "${COMMIT_SHA}" \
            "${COMMIT_MESSAGE}" \
            "${BUILD_TIMESTAMP}")"

          DESCRIPTION="$(printf '%s\n\n**Downloads**\n%s\n\n[View GitHub Actions run](<https://github.com/%s/actions/runs/%s>)' \
            "${SUMMARY_LINE}" \
            "${DOWNLOADS}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}")"

          PAYLOAD="$(jq -cn \
            --arg title "Pathmind test builds" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$DESCRIPTION" \
            '{
              embeds: [
                {
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5763719
                }
              ]
            }')"

          curl --fail-with-body -sS \
            -X POST \
            "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
